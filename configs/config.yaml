model:
  name: 'unet'
  encoder_name: 'se_resnext50_32x4d'
  encoder_weights: imagenet
  classes: 1
  activation: null
  dropout: 0.2

dataset:
  root: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers'
  patch_size: [512, 512]
  stride: [256, 256]
  num_patches: 50
  num_workers: 4
  #curriculum_dir: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers/curriculum_masks'
  #positive_ratio: 0.8
  #fg_threshold: 0.04

  feature_dirs:
    image: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers/enhanced_images'
    #sato: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers/sato_images'
    mask: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers/masks'
    distance: '/data/smadper@alumno.upv.es/TFM/datasets/laticifers/distance_maps_pt'


train:
  batch_size: 32
  num_epochs: 80
  learning_rate: 0.001
  accumulation_steps: 1
  save_dir: '/data/smadper@alumno.upv.es/TFM/checkpoints_tmp'
  log_interval: 1
  patience: 15
  mixed_precision: true
  lambda_consistency: 0.25
  confidence_thresh: 0.9
  warmup_epochs: 10
#  curriculum_schedule:  # (epoch_threshold, dilation_level)
#    - [0, 4]
#    - [5, 3]
#    - [10, 2]
#    - [20, 1]
#    - [30, 0]


test:
  batch_size: 1

loss:
  name: "bce"       # Options: bce, dice, tversky, focal_tversky, ...
  combine_with: tversky         # Optional: another loss to combine with
  weights:
    main: 0.5
    combined: 1.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  focal_tversky_gamma: 0.75
  cldice_alpha: 0.05
  cbdice_alpha: 1.0
  cbdice_beta: 1.0
  use_topographic: false     # If true, uses distance-weighted loss
  topo:
    alpha: 2.0
    beta: 1.0